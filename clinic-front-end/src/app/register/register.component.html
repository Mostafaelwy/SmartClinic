<div class="content" style="min-height: 212.9px;">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-8 offset-md-2">
        <!-- Login Tab Content -->
        <div class="account-content">
          <div class="row align-items-center justify-content-center">
            <div class="col-md-7 col-lg-6 login-left">
              <img src="assets/img/login-banner.png" class="img-fluid" alt="Doccure Login">
            </div>
            <div class="col-md-12 col-lg-6 login-right">
              <div class="login-header">
                <h3>Patient Register</h3>
                <button type="button" (click)="goToDoctorRegister()" class="btn btn-link" style="padding-left:0;">Are you a Doctor?</button>
              </div>
              <form (ngSubmit)="onSubmit()">
                <div class="mb-3">
                  <label class="form-label">Name</label>
                  <input type="text" class="form-control" [(ngModel)]="name" name="name" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Phone</label>
                  <input type="text" class="form-control" [(ngModel)]="phone" name="phone" required>
                </div>
                <div class="mb-3">
                  <div class="form-group-flex">
                    <label class="form-label">Create Password</label>
                  </div>
                  <div class="pass-group">
                    <input type="password" class="form-control pass-input" [(ngModel)]="password" name="password" required>
                    <span class="feather-eye-off toggle-password"></span>
                  </div>
                </div>
                <div class="mb-3">
                  <button class="btn btn-primary-gradient w-100" type="submit">Sign Up</button>
                </div>
                <div class="login-or">
                  <span class="or-line"></span>
                  <span class="span-or">or</span>
                </div>
                <div class="social-login-btn">
                  <a href="javascript:void(0);" class="btn w-100">
                    <img src="assets/img/icons/google-icon.svg" alt="google-icon">Sign in With Google
                  </a>
                  <a href="javascript:void(0);" class="btn w-100">
                    <img src="assets/img/icons/facebook-icon.svg" alt="fb-icon">Sign in With Facebook
                  </a>
                </div>
                <div class="account-signup">
                  <p>Already have account? <a routerLink="/login">Sign In</a></p>
                </div>
              </form>
            </div>
          </div>
        </div>
        <!-- /Login Tab Content -->
      </div>
    </div>
  </div>
</div>
