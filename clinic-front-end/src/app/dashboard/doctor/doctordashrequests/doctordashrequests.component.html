<div class="">

    <div class="dashboard-header">
        <h3>Requests</h3>
        <ul>
            <li>

                <div class="dropdown header-dropdown">
                    <select class="dropdown-toggle nav-tog" [(ngModel)]="selectedRange" (change)="updateDateRange(selectedRange)">
                    <option *ngFor="let option of dateRangeOptions" [ngValue]="option">
                        {{ option }}
                    </option>
                </select>

                </div>
            </li>
        </ul>
    </div>

    <!-- Request List -->
    <div *ngFor="let reservation of reservationItems" class="appointment-wrap">
        <ul>
            <li>
                <div class="patinet-information">
                    <a href="patient-profile.html">
                        <img src="assets/img/doctors-dashboard/profile-01.jpg" alt="User Image">
                    </a>
                    <div class="patient-info">
                        <p>#{{ reservation.id }}</p>
                        <h6><a href="patient-profile.html">{{ reservation.patientName }}</a><span class="badge new-tag">New</span></h6>
                    </div>
                </div>
            </li>
            <li class="appointment-info">
                <p><i class="isax isax-clock5"></i>{{ reservation.reservationDate | date:'dd MMM yyyy hh:mm a' }}</p>
                <p class="md-text">{{ reservation.visitType }}</p>
            </li>
            <!-- <li class="appointment-type">
                <p class="md-text">Type of Appointment</p>
                <p><i class="isax isax-video5 text-blue"></i>Video Call</p>
            </li> -->
            <li>
                <ul class="request-action">
                    <li>
                        <a  (click)="onAccept(reservation.id)" class="accept-link" data-bs-toggle="modal" data-bs-target="#accept_appointment"><i class="fa-solid fa-check"></i>Accept</a>
                    </li>
                    <li>
                        <a (click)="onReject(reservation.id)" class="reject-link" data-bs-toggle="modal" data-bs-target="#cancel_appointment"><i class="fa-solid fa-xmark"></i>Reject</a>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
    <!-- /Request List -->

    <div class="row">
        <div class="col-md-12">
            <div class="loader-item text-center">
                <a (click)="onLoadMore()" class="btn btn-load">Load More</a>
            </div>
        </div>
    </div>

</div>
