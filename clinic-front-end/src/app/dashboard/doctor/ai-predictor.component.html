<header>
  <h1>Blood-Brain Barrier Permeability Predictor</h1>
</header>

<div class="ai-tabs nav nav-tabs mb-4 justify-content-center">
  <button class="nav-link" [class.active]="activeTab === 'predict'" (click)="switchTab('predict')">Prediction</button>
  <button class="nav-link" [class.active]="activeTab === 'settings'" (click)="switchTab('settings')">Settings</button>
</div>

<div *ngIf="activeTab === 'settings'">
  <div class="card shadow p-4 mb-4 bg-white rounded" style="max-width: 500px; margin: 0 auto;">
    <h3 class="mb-3 text-center">Predictor Endpoint Settings</h3>
    <form (ngSubmit)="saveEndpoint()" autocomplete="off">
      <div class="mb-3">
        <label for="endpointInput" class="form-label">Predictor Endpoint URL</label>
        <input id="endpointInput" type="text" [(ngModel)]="endpointUrl" name="endpointUrl" class="form-control" placeholder="http://127.0.0.1:5000/predict_majority">
      </div>
      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-success btn-lg">Save Endpoint</button>
      </div>
    </form>
    <div class="mt-3 text-success text-center" *ngIf="endpointUrl">
      <span class="fw-bold">Current:</span> {{ endpointUrl }}
    </div>
  </div>
</div>

<div *ngIf="activeTab === 'predict'">
  <div class="card shadow p-4 mb-4 bg-white rounded" style="max-width: 500px; margin: 0 auto;">
    <h2 class="mb-3 text-center">Blood-Brain Barrier Permeability Predictor</h2>
    <form (ngSubmit)="predict()" autocomplete="off">
      <div class="mb-3">
        <label for="smilesInput" class="form-label">Enter SMILES</label>
        <input id="smilesInput" type="text" [(ngModel)]="smiles" name="smiles" class="form-control" placeholder="e.g. C1=CC=CC=C1 (Benzene)">
      </div>
      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary btn-lg">Predict</button>
      </div>
    </form>
    <div *ngIf="predictionResult" class="mt-4">
      <div [ngClass]="'result-display fw-bold display-4 text-center ' + resultClass" style="font-size:2.5rem;">{{ predictionResult }}</div>
    </div>
    <div *ngIf="error" class="alert alert-danger mt-3 text-center">{{ error }}</div>
    <div *ngIf="detailsLinkVisible" class="mt-4">
      <div *ngIf="canonicalSmiles" class="mb-2 text-center">
        <strong>Canonical SMILES:</strong> <span class="text-monospace">{{ canonicalSmiles }}</span>
      </div>
      <div *ngIf="modelResults as modelResultsStr">
        <strong>Model Predictions:</strong>
        <ul class="list-group list-group-flush mt-2">
          <li *ngFor="let entry of (modelResultsStr | jsonToEntries)" class="list-group-item d-flex justify-content-between align-items-center">
            <span>{{ entry.key }}</span>
            <span class="badge bg-secondary">{{ entry.value }}</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
