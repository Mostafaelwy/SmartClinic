<div >
  <div class="dashboard-header">
    <h3>Change Password</h3>
  </div>
  <form (ngSubmit)="onSubmit()">
    <div class="card pass-card">
      <div class="card-body">
        <div class="row">
          <div class="col-md-6">
            <div class="input-block input-block-new">
              <label class="form-label">Old Password</label>
              <input type="password" class="form-control" [(ngModel)]="oldPassword" name="oldPassword" required>                  
            </div>
            <div class="input-block input-block-new">
              <label class="form-label">New Password</label>
              <div class="pass-group">
                <input [type]="showNewPassword ? 'text' : 'password'" class="form-control pass-input" [(ngModel)]="newPassword" name="newPassword" required>
                <span class="feather-eye-off toggle-password" (click)="toggleNewPassword()" style="cursor:pointer;"></span>
              </div>                  
            </div>
            <div class="input-block input-block-new mb-0">
              <label class="form-label">Confirm Password</label>
              <div class="pass-group">
                <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control pass-input-sub" [(ngModel)]="confirmPassword" name="confirmPassword" required>
                <span class="feather-eye-off toggle-password-sub" (click)="toggleConfirmPassword()" style="cursor:pointer;"></span>
              </div>                  
            </div>
            <div *ngIf="error" class="alert alert-danger mt-2">{{ error }}</div>
            <div *ngIf="message" class="alert alert-success mt-2">{{ message }}</div>
          </div>
        </div>
      </div>
    </div>
    <div class="form-set-button">
      <button class="btn btn-light" type="button" [disabled]="loading">Cancel</button>
      <button class="btn btn-primary" type="submit" [disabled]="loading">Save Changes</button>
    </div>
  </form>
</div>
