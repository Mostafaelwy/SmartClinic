<!-- Main Wrapper -->
<div class="main-wrapper">
		
  
    
    <!-- Page Content -->
    <div class="content">
        <div class="container-fluid">
            
            <div class="row">
                <div class="col-md-8 offset-md-2">
                    
                    <!-- Login Tab Content -->
                    <div class="account-content">
                        <div class="row align-items-center justify-content-center">
                            <div class="col-md-7 col-lg-6 login-left">
                                <img src="assets/img/login-banner.png" class="img-fluid" alt="Doccure Login">	
                            </div>
                            <div class="col-md-12 col-lg-6 login-right">
                                <div class="login-header">
                                    <h3>Login <span>Doccure</span></h3>
                                </div>
                                <form (ngSubmit)="onSubmit()" #loginForm="ngForm" >
                                    <div class="mb-3">
                                        <label class="form-label" >E-mail</label>
                                        <input type="text" name="email" [(ngModel)]="email" #emailI="ngModel" class="form-control">
                                    </div>
                                    <div class="mb-3">
                                        <div class="form-group-flex">
                                            <label class="form-label"  >Password</label>
                                        </div>
                                        <div class="pass-group">
                                            <input type="password" class="form-control pass-input"  id="password" [(ngModel)]="password" #passwordI="ngModel" name="password">
                                            <span class="feather-eye-off toggle-password"></span>
                                        </div>
                                        <div *ngIf="loginError" class="alert alert-danger">
                                        {{ loginError }}
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <button class="btn btn-primary-gradient w-100" type="submit">Sign in</button>
                                    </div>
                                  
                                    
                                    <div class="account-signup">
                                        <p>Don't have an account ? <a class="btn btn-link p-0 align-baseline" (click)="onSignUpClick()">Sign up</a></p>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    <!-- /Login Tab Content -->
                        
                </div>
            </div>

        </div>

    </div>		
    <!-- /Page Content -->

 
   
</div>
<!-- /Main Wrapper -->
